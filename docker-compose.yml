services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: costureira_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./firebase_credenciais.json:/var/www/html/firebase_credenciais.json:ro
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=costureira_db
      - DB_USERNAME=costureira_user
      - DB_PASSWORD=costureira_pass
      - GOOGLE_APPLICATION_CREDENTIALS=/var/www/html/firebase_credenciais.json
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: costureira_db
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=costureira_db
      - MYSQL_USER=costureira_user
      - MYSQL_PASSWORD=costureira_pass
      - MYSQL_ROOT_PASSWORD=costureira_root_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

volumes:
  mysql_data:
